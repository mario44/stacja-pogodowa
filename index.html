<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stacja Pogodowa">
  <title>Stacja Pogodowa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    input, button, select, textarea {
      font-family: inherit;
      font-size: 16px;
      user-select: text;
      -webkit-user-select: text;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
    }
    .location-name {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }
    .current-date {
      font-size: 18px;
      color: #80D8FF;
      margin-top: 6px;
      text-transform: capitalize;
    }
    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 4px;
    }
    .clock-time {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }
    .btn-search {
      background-color: #3A3A3C;
      border: none;
      border-radius: 12px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-search svg {
      width: 24px;
      height: 24px;
      fill: #00E5FF;
    }
    .divider {
      height: 1.5px;
      background-color: #444444;
      width: 100%;
    }
    /* iOS Safari Pixel-Exact Ticker */
    .weather-desc-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .weather-desc-track {
      display: flex;
      width: max-content;
      will-change: transform;
    }
    .weather-desc-block {
      display: flex;
      flex-shrink: 0;
      -webkit-flex-shrink: 0;
      align-items: center;
      white-space: nowrap;
    }
    .weather-desc-text {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      text-transform: capitalize;
    }
    .weather-desc-spacer {
      font-size: 24px;
      font-weight: 600;
      color: #80D8FF;
      padding: 0 16px;
    }
    .main-weather-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .weather-icon-col {
      flex: 1;
      display: flex;
      justify-content: center;
    }
    .weather-icon-col svg, .weather-icon-col img {
      width: 90px;
      height: 90px;
    }
    .stats-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .temp-text {
      font-size: 44px;
      font-weight: 800;
      color: #ffffff;
    }
    .sub-stat {
      font-size: 18px;
      font-weight: 700;
      color: #80D8FF;
    }
    .wind-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wind-icon {
      width: 54px;
      height: 54px;
      transition: transform 0.5s ease;
    }
    .wind-speed {
      font-size: 18px;
      font-weight: 700;
      margin-top: 6px;
      color: #ffffff;
    }
    .forecast-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .forecast-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .forecast-day {
      font-size: 18px;
      font-weight: 700;
    }
    .forecast-temp {
      font-size: 16px;
      font-weight: 700;
      color: #80D8FF;
      margin-top: 2px;
    }
    .forecast-icon {
      width: 46px;
      height: 46px;
      margin-top: 6px;
    }
    .sun-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      text-align: center;
    }
    .sun-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sun-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sun-time {
      font-size: 22px;
      font-weight: 800;
      color: #80D8FF;
      margin-top: 4px;
    }
    .sun-icon {
      width: 44px;
      height: 44px;
      margin-top: 4px;
    }
    .moon-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }
    .moon-icon {
      width: 54px;
      height: 54px;
    }
    .moon-info {
      display: flex;
      flex-direction: column;
    }
    .moon-title {
      font-size: 18px;
      font-weight: 700;
    }
    .moon-details {
      font-size: 14px;
      color: #80D8FF;
      margin-top: 2px;
    }
    /* Modal Search */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #000000;
      z-index: 1000;
      padding: 20px;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }
    .modal.active {
      display: flex;
    }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      background-color: #3A3A3C;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }
    .search-input-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .search-input {
      flex: 1;
      height: 48px;
      background-color: #2C2C2E;
      border: 1px solid #444444;
      border-radius: 12px;
      padding: 0 16px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }
    .btn-do-search {
      background-color: #3A3A3C;
      color: #00E5FF;
      border: 1px solid #444444;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .search-results-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .search-item {
      background-color: #1C1C1E;
      border: 1px solid #444444;
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
    }
    .search-item-title {
      font-size: 17px;
      font-weight: 700;
    }
    .search-item-sub {
      font-size: 13px;
      color: #AAAAAA;
      margin-top: 2px;
    }
  </style>
</head>

  <script>
    let currentLat = localStorage.getItem('selected_lat') || '53.40416667';
    let currentLon = localStorage.getItem('selected_lon') || '14.52361111';
    let currentName = localStorage.getItem('selected_name') || 'Szczecin';
    let imieninyMap = {};

    // Dynamic Pixel-Exact JS Marquee Ticker for 100% Perfect Loop on iOS Safari
    let marqueePos = 0;
    let marqueeAnim = null;

    function startMarquee() {
      const track = document.getElementById('weatherDescTrack');
      const block1 = document.getElementById('weatherDescBlock1');
      if (!track || !block1) return;

      function step() {
        const width = block1.offsetWidth;
        if (width > 0) {
          marqueePos += 0.8; // Smooth 60fps speed
          if (marqueePos >= width) {
            marqueePos -= width;
          }
          const transformStr = `translate3d(-${marqueePos}px, 0, 0)`;
          track.style.transform = transformStr;
          track.style.webkitTransform = transformStr;
        }
        marqueeAnim = requestAnimationFrame(step);
      }

      if (marqueeAnim) cancelAnimationFrame(marqueeAnim);
      marqueePos = 0;
      step();
    }

    // Fetch Imieniny
    async function fetchImieniny() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/mario44/stacja-pogodowa/refs/heads/main/imieniny.json');
        imieninyMap = await res.json();
        updateWeatherDescText();
      } catch (e) {
        console.error("Imieniny fetch error:", e);
      }
    }
    fetchImieniny();

    // Clock Ticker (runs every 1 sec)
    function updateClock() {
      const now = new Date();
      document.getElementById('tvCurrentTime').innerText = now.toLocaleTimeString('pl-PL', { hour12: false });

      const options = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
      document.getElementById('tvCurrentDate').innerText = now.toLocaleDateString('pl-PL', options);

      updateMoonPhase(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Moon Phase Calculator in Polish
    function updateMoonPhase(date) {
      const year = date.getUTCFullYear();
      let month = date.getUTCMonth() + 1;
      const day = date.getUTCDate();
      const hour = date.getUTCHours();
      const minute = date.getUTCMinutes();

      let y = year, m = month;
      if (m <= 2) { y -= 1; m += 12; }
      const a = Math.floor(y / 100);
      const b = Math.floor(a / 4);
      const c = 2 - a + b;
      const e = Math.floor(365.25 * (y + 4716));
      const f = Math.floor(30.6001 * (m + 1));
      const jd = c + day + e + f - 1524.5 + (hour + minute / 60.0) / 24.0;

      const daysSinceNew = jd - 2460320.33;
      const synodicMonth = 29.530588;
      let moonAge = daysSinceNew % synodicMonth;
      if (moonAge < 0) moonAge += synodicMonth;

      const phaseAngle = (moonAge / synodicMonth) * 2.0 * Math.PI;
      const illumination = Math.round(((1.0 - Math.cos(phaseAngle)) / 2.0) * 100.0);

      let phaseName = "Nów";
      let moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#333333" stroke="#FFFFFF" stroke-width="1.5"/></svg>';

      if (moonAge < 1.84 || moonAge >= 27.69) {
        phaseName = "Nów";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#222222" stroke="#FFFFFF" stroke-width="1.5"/></svg>';
      } else if (moonAge < 5.53) {
        phaseName = "Sierp przybywający";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#222222"/><path d="M16 4 A12 12 0 0 1 16 28 A8 12 0 0 0 16 4 Z" fill="#FFFFFF"/></svg>';
      } else if (moonAge < 9.23) {
        phaseName = "Pierwsza kwadra";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#222222"/><path d="M16 4 A12 12 0 0 1 16 28 Z" fill="#FFFFFF"/></svg>';
      } else if (moonAge < 12.92) {
        phaseName = "Księżyc przybywający";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#FFFFFF"/><path d="M16 4 A8 12 0 0 0 16 28 A12 12 0 0 0 16 4 Z" fill="#222222"/></svg>';
      } else if (moonAge < 16.61) {
        phaseName = "Pełnia";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#FFFFFF"/></svg>';
      } else if (moonAge < 20.30) {
        phaseName = "Księżyc ubywający";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#FFFFFF"/><path d="M16 4 A8 12 0 0 0 16 28 A12 12 0 0 0 16 4 Z" fill="#222222"/></svg>';
      } else if (moonAge < 23.99) {
        phaseName = "Ostatnia kwadra";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#222222"/><path d="M16 4 A12 12 0 0 0 16 28 Z" fill="#FFFFFF"/></svg>';
      } else {
        phaseName = "Sierp ubywający";
        moonSvg = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#222222"/><path d="M16 4 A12 12 0 0 0 16 28 A8 12 0 0 1 16 4 Z" fill="#FFFFFF"/></svg>';
      }

      document.getElementById('tvMoonPhaseTitle').innerText = phaseName;
      document.getElementById('tvMoonPhaseDetails').innerText = `Oświetlenie: ${illumination}% • Dzień cyklu: ${moonAge.toFixed(1)}`;
      document.getElementById('ivMoonIcon').innerHTML = moonSvg;
    }

    // Synchronized Dynamic Weather SVG
    function getWeatherSvg(iconCode, cloudP) {
      if (!iconCode) return '<svg viewBox="0 0 32 32"><path d="M8 22h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 22z" fill="#D1D5DB"/></svg>';
      const code = iconCode.toLowerCase().trim();
      const match = code.match(/n(\d)z(\d{2})[dn]?/);

      if (match) {
        const cloudLevel = parseInt(match[1], 10);
        const phen = match[2];

        // Thunderstorm
        if (['85', '86', '90'].includes(phen)) {
          return '<svg viewBox="0 0 32 32"><path d="M8 18h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 18z" fill="#6B7280"/><polygon points="16,19 12,25 15,25 13,29 19,23 16,23" fill="#FBBF24"/></svg>';
        }
        // Rain
        if (['60', '61', '63', '66', '68', '70', '71', '73', '76', '80', '83', '84'].includes(phen)) {
          return '<svg viewBox="0 0 32 32"><path d="M8 18h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 18z" fill="#9CA3AF"/><g stroke="#00E5FF" stroke-width="2" stroke-linecap="round"><line x1="10" y1="21" x2="8" y2="26"/><line x1="16" y1="21" x2="14" y2="26"/><line x1="22" y1="21" x2="20" y2="26"/></g></svg>';
        }
        // Fog
        if (['45', '49', '50'].includes(phen)) {
          return '<svg viewBox="0 0 32 32"><g stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"><line x1="6" y1="12" x2="26" y2="12"/><line x1="8" y1="16" x2="24" y2="16"/><line x1="6" y1="20" x2="26" y2="20"/></g></svg>';
        }
        // Overcast / Cloudy
        if (['08', '09', '10'].includes(phen) || cloudLevel >= 8) {
          return '<svg viewBox="0 0 32 32"><path d="M8 22h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 22z" fill="#D1D5DB"/></svg>';
        }
        // Scattered Clouds
        if (['06', '07'].includes(phen) || (cloudLevel >= 3 && cloudLevel <= 7)) {
          return '<svg viewBox="0 0 32 32"><path d="M8 22h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 22z" fill="#D1D5DB"/></svg>';
        }
        // Few / Partly Cloudy
        if (['04', '05'].includes(phen) || cloudLevel === 1 || cloudLevel === 2) {
          return '<svg viewBox="0 0 32 32"><circle cx="11" cy="11" r="6" fill="#FFBE3C"/><path d="M10 23h12a5 5 0 0 0 0-10 6 6 0 0 0-11.7-1.3A4.5 4.5 0 0 0 10 23z" fill="#D1D5DB"/></svg>';
        }
        // Sun
        if (cloudLevel === 0) {
          return '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7" fill="#FFBE3C"/><g stroke="#FFBE3C" stroke-width="2" stroke-linecap="round"><line x1="16" y1="3" x2="16" y2="6"/><line x1="16" y1="26" x2="16" y2="29"/><line x1="3" y1="16" x2="6" y2="16"/><line x1="26" y1="16" x2="29" y2="16"/><line x1="6.8" y1="6.8" x2="8.9" y2="8.9"/><line x1="23.1" y1="23.1" x2="25.2" y2="25.2"/><line x1="6.8" y1="25.2" x2="8.9" y2="23.1"/><line x1="23.1" y1="8.9" x2="25.2" y2="6.8"/></g></svg>';
        }
      }

      // Fallback cloud
      const c = parseInt(cloudP || '0', 10);
      if (c < 20) return '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7" fill="#FFBE3C"/><g stroke="#FFBE3C" stroke-width="2" stroke-linecap="round"><line x1="16" y1="3" x2="16" y2="6"/><line x1="16" y1="26" x2="16" y2="29"/><line x1="3" y1="16" x2="6" y2="16"/><line x1="26" y1="16" x2="29" y2="16"/><line x1="6.8" y1="6.8" x2="8.9" y2="8.9"/><line x1="23.1" y1="23.1" x2="25.2" y2="25.2"/><line x1="6.8" y1="25.2" x2="8.9" y2="23.1"/><line x1="23.1" y1="8.9" x2="25.2" y2="6.8"/></g></svg>';
      if (c < 50) return '<svg viewBox="0 0 32 32"><circle cx="11" cy="11" r="6" fill="#FFBE3C"/><path d="M10 23h12a5 5 0 0 0 0-10 6 6 0 0 0-11.7-1.3A4.5 4.5 0 0 0 10 23z" fill="#D1D5DB"/></svg>';
      return '<svg viewBox="0 0 32 32"><path d="M8 22h16a6 6 0 0 0 0-12 7 7 0 0 0-13.6-1.5A5 5 0 0 0 8 22z" fill="#D1D5DB"/></svg>';
    }

    function getWeatherDescText(iconCode, cloudP) {
      if (!iconCode) return 'Bezchmurnie';
      const code = iconCode.toLowerCase().trim();
      const match = code.match(/n(\d)z(\d{2})[dn]?/);

      if (match) {
        const cloudLevel = parseInt(match[1], 10);
        const phen = match[2];

        if (['85', '86', '90'].includes(phen)) return 'Burza';
        if (['76', '80', '83', '84'].includes(phen)) return 'Ulewny deszcz';
        if (['68', '70', '71', '73'].includes(phen)) return 'Deszcz';
        if (['60', '61', '63', '66'].includes(phen)) return 'Słaby deszcz';
        if (['45', '49', '50'].includes(phen)) return 'Mgła';

        if (['08', '09', '10'].includes(phen) || cloudLevel >= 8) return 'Pochmurno';
        if (['06', '07'].includes(phen) || (cloudLevel >= 3 && cloudLevel <= 7)) return 'Zachmurzenie duże';
        if (['04', '05'].includes(phen) || cloudLevel === 1 || cloudLevel === 2) return 'Zachmurzenie umiarkowane';
        if (cloudLevel === 0) return 'Bezchmurnie';
      }

      const c = parseInt(cloudP || '0', 10);
      if (c < 20) return 'Bezchmurnie';
      if (c < 50) return 'Zachmurzenie małe';
      if (c < 80) return 'Zachmurzenie duże';
      return 'Pochmurno';
    }

    function updateWeatherDescText() {
      const now = new Date();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const key = `${m}-${d}`;

      const rawNames = imieninyMap[key] || '';
      const cleanNames = rawNames.replace(/[\r\n]+/g, '').trim();

      const baseDesc = window.currentWeatherDescText || 'Bezchmurnie';
      let fullText = baseDesc;
      if (cleanNames) {
        fullText += `  •  Imieniny: ${cleanNames}`;
      }

      document.getElementById('tvWeatherDesc1').innerText = fullText;
      document.getElementById('tvWeatherDesc2').innerText = fullText;

      // Start Pixel-Exact JS Marquee Ticker
      setTimeout(startMarquee, 100);
    }

    // Weather Fetching
    async function fetchWeather() {
      document.getElementById('tvLocationName').innerText = currentName;

      try {
        const hybridUrl = `https://meteo.imgw.pl/api/v1/forecast/fcapi?token=p4DXKjsYadfBV21TYrDk&lat=${currentLat}&lon=${currentLon}&m=hybrid`;
        const gfsUrl = `https://fcapi-gfs.imgw.pl/get?lat=${currentLat}&lon=${currentLon}&z=0&m=gfs&lasttime=0&p=mobile`;

        const [hybridRes, gfsRes] = await Promise.allSettled([
          fetch(hybridUrl).then(r => r.json()),
          fetch(gfsUrl).then(r => r.json())
        ]);

        const hybridData = hybridRes.status === 'fulfilled' ? hybridRes.value.data : null;
        const gfsData = gfsRes.status === 'fulfilled' ? gfsRes.value : null;

        updateUI(hybridData, gfsData);
      } catch (e) {
        console.error("Fetch error:", e);
      }
    }

    function updateUI(hybrid, gfs) {
      const hourlyList = (hybrid && hybrid.Data) ? hybrid.Data : ((gfs && gfs.Data) ? gfs.Data : []);

      // Select valid current item
      const nowMs = Date.now();
      const validItems = hourlyList.filter(item => parseFloat(item.Temperature || 0) > 200.0);
      let currentItem = validItems[0];
      let minDiff = Infinity;

      for (let item of validItems) {
        const itemMs = new Date(item.Date).getTime();
        const diff = Math.abs(itemMs - nowMs);
        if (diff < minDiff) {
          minDiff = diff;
          currentItem = item;
        }
      }

      if (currentItem) {
        const tempC = (parseFloat(currentItem.Temperature) - 273.15).toFixed(1);
        document.getElementById('tvTemperature').innerText = `${tempC}°`;
        document.getElementById('tvHumidity').innerText = `${currentItem.Humidity || '--'}%`;

        // Pressure Conversion (Pa -> hPa)
        let rawPres = parseFloat(currentItem.PressureMSL || currentItem.Pressure || 0);
        if (rawPres > 2000) {
          rawPres = rawPres / 100.0;
        }
        document.getElementById('tvPressure').innerText = `${rawPres > 0 ? Math.round(rawPres) : '--'} hPa`;

        document.getElementById('tvWindSpeed').innerText = `${Math.round(parseFloat(currentItem.Wind_Speed || 0))} m/s`;

        const windDeg = parseFloat(currentItem.Wind_Dir || 0);
        document.getElementById('ivWindIcon').style.transform = `rotate(${windDeg}deg)`;

        // Update Weather Icon & Description
        const iconCode = currentItem.Icon || currentItem.Icon10;
        document.getElementById('ivMainWeatherIcon').innerHTML = getWeatherSvg(iconCode, currentItem.Cloud);

        window.currentWeatherDescText = getWeatherDescText(iconCode, currentItem.Cloud);
        updateWeatherDescText();
      }

      // Forecast
      const hybridDaily = (hybrid && hybrid.Daily_Data) ? hybrid.Daily_Data : [];
      const gfsDaily = (gfs && gfs.Daily_Data) ? gfs.Daily_Data : [];
      const combinedDaily = [...hybridDaily, ...gfsDaily];

      const uniqueDays = [];
      const seenDates = new Set();
      for (let day of combinedDaily) {
        const dateKey = day.Date ? day.Date.substring(0, 10) : '';
        if (dateKey && !seenDates.has(dateKey)) {
          seenDates.add(dateKey);
          uniqueDays.push(day);
        }
      }

      const dayNamesPl = ['NIE', 'PON', 'WTO', 'ŚRO', 'CZW', 'PIĄ', 'SOB'];

      for (let i = 1; i <= 4; i++) {
        const dayIdx = i - 1;
        if (dayIdx < uniqueDays.length) {
          const dayData = uniqueDays[dayIdx];
          const dateObj = new Date(dayData.Date);
          const dayName = dayNamesPl[dateObj.getDay()] || 'DZIEŃ';
          const minC = Math.round(parseFloat(dayData.Temp_Min) - 273.15);
          const maxC = Math.round(parseFloat(dayData.Temp_Max) - 273.15);

          document.getElementById(`tvDay${i}`).innerText = dayName;
          document.getElementById(`tvTemp${i}`).innerText = `${minC}-${maxC}°`;
          document.getElementById(`ivIcon${i}`).innerHTML = getWeatherSvg(dayData.Icon, dayData.Cloud_Ave);
        }
      }

      // Sun
      const sun = (hybrid && hybrid.Sun) ? hybrid.Sun : ((gfs && gfs.Sun) ? gfs.Sun : null);
      if (sun) {
        if (sun.Sunrise) document.getElementById('tvSunriseTime').innerText = new Date(sun.Sunrise).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
        if (sun.Sunset) document.getElementById('tvSunsetTime').innerText = new Date(sun.Sunset).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
      }
    }

    // Refresh weather every 10 mins automatically
    setInterval(fetchWeather, 10 * 60 * 1000);
    fetchWeather();

    // Modal Search Logic
    const searchModal = document.getElementById('searchModal');
    const searchForm = document.getElementById('searchForm');
    const etQuery = document.getElementById('etSearchQuery');
    const rvResults = document.getElementById('rvSearchResults');

    document.getElementById('btnOpenSearch').onclick = () => {
      searchModal.classList.add('active');
      setTimeout(() => etQuery.focus(), 100);
    };
    document.getElementById('btnCloseSearch').onclick = () => {
      searchModal.classList.remove('active');
    };

    searchForm.onsubmit = (e) => {
      e.preventDefault();
      const query = etQuery.value.trim();
      if (query.length >= 1) {
        doSearch(query);
      }
    };

    async function doSearch(query) {
      try {
        const res = await fetch(`https://meteo.imgw.pl/api/geo/v2/search/${encodeURIComponent(query)}`);
        const list = await res.json();
        rvResults.innerHTML = '';

        list.forEach(item => {
          const li = document.createElement('li');
          li.className = 'search-item';
          li.innerHTML = `
            <div class="search-item-title">${item.identifier || item.name}</div>
            <div class="search-item-sub">woj. ${item.province || ''}, pow. ${item.district || ''}</div>
          `;
          li.onclick = () => {
            currentLat = item.lat;
            currentLon = item.lon;
            currentName = item.name || item.identifier;

            localStorage.setItem('selected_lat', currentLat);
            localStorage.setItem('selected_lon', currentLon);
            localStorage.setItem('selected_name', currentName);

            searchModal.classList.remove('active');
            fetchWeather();
          };
          rvResults.appendChild(li);
        });
      } catch (e) {
        console.error("Search error:", e);
      }
    }
  </script>
